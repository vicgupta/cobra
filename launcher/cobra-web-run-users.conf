# cobra-web drop-in (zz-run-users.conf): agent steps go through the run launcher as cobra-run-<tenantId>.
[Service]
Environment=COBRA_LAUNCHER_SOCKET=/run/cobra-launcher.sock
Environment=COBRA_TEAMS_ROOT=/srv/cobra-teams
Environment=COBRA_WORKSPACES_DIR=/home/cobra/workspaces
Environment=COBRA_NPM_TOOLS_PREFIX=/opt/cobra-tools
Environment=PATH=/opt/cobra-tools/bin:/home/cobra/.local/bin:/usr/local/bin:/usr/bin:/bin
